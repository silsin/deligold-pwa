###############################################################################
# delly-pwa — production compose
#
#   docker compose up --build                 serve on http://localhost:9741
#   API_UPSTREAM=http://host.docker.internal:7456 docker compose up
#
# The image is self-contained; `depends_on` on the API is intentionally NOT
# used, because nginx resolves the upstream per-request (see docker/entrypoint.sh)
# and therefore starts fine without it.
###############################################################################

services:
  delly-pwa:
    build:
      context: .
      # Baked into the bundle at build time. Empty by default, which keeps the
      # relative '/'-based API URL — correct when API_UPSTREAM proxies /api, and
      # also correct behind an existing reverse proxy that already routes /api.
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: delly-pwa:${IMAGE_TAG:-latest}
    container_name: delly-pwa
    ports:
      - "${PORT:-9741}:${PORT:-9741}"
    environment:
      PORT: ${PORT:-9741}
      # Set this to make the PWA same-origin with the API, e.g.
      #   Docker Desktop: http://host.docker.internal:7456
      #   compose service: http://delly-api:7456
      API_UPSTREAM: ${API_UPSTREAM:-}
      DNS_RESOLVER: ${DNS_RESOLVER:-127.0.0.11}
    restart: unless-stopped
    healthcheck:
      # Inherited from the image, but made explicit so `docker compose ps`
      # reports it and it is obvious how to override.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://127.0.0.1:${PORT:-9741}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
