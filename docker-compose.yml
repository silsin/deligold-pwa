###############################################################################
# delly — ONE repo, ONE command: API (NestJS) + PWA (nginx) side by side.
#
#   docker compose up --build -d
#     PWA:  http://localhost:9741
#     API:  http://localhost:7456   (internal via the pwa proxy; also published)
#
# The pwa container's nginx proxies the nine NestJS routes (/auth /users /invites /trade
# /wallet /market /reports /stores /uploads) to the api service at request time,
# so the browser stays same-origin and needs no CORS. Data (SQLite DB + uploaded
# receipts) lives on the delly_data volume and survives rebuilds.
#
# Override secrets/ports via .env (see .env.example): JWT_SECRET, PORT, API_PORT.
###############################################################################

services:
  api:
    build: ./api
    image: delly-api:${IMAGE_TAG:-latest}
    container_name: delly-api
    environment:
      PORT: 7456
      # SQLite file + receipts on the shared volume, outside the container fs.
      DATABASE_URL: "file:/data/dev.db"
      UPLOAD_DIR: /data/uploads
      # CHANGE THIS via .env in any real deployment.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Live price feed (akbarigold.ir). REQUIRED — see .env.example. Left blank
      # the board serves hard-coded indicative prices and flags every quote stale.
      MARKET_UID: ${MARKET_UID:-}
      MARKET_TOKEN: ${MARKET_TOKEN:-}
    volumes:
      - delly_data:/data
    ports:
      - "${API_PORT:-7456}:7456"
    restart: unless-stopped
    healthcheck:
      # Public board route — enough to prove the HTTP server + DB are alive.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://127.0.0.1:7456/market/board"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 25s

  pwa:
    build:
      context: .
      args:
        # Baked into the bundle at build time. EMPTY is correct here: the
        # container proxies the API routes itself (API_UPSTREAM below).
        VITE_API_URL: ${VITE_API_URL:-}
    image: delly-pwa:${IMAGE_TAG:-latest}
    container_name: delly-pwa
    depends_on:
      - api
    environment:
      PORT: 9741
      # Same-origin proxy target. nginx resolves the hostname `api` per request
      # through Docker's embedded DNS (DNS_RESOLVER), so startup order does not
      # matter and a restarting api container never breaks nginx.
      API_UPSTREAM: http://api:7456
      DNS_RESOLVER: 127.0.0.11
    ports:
      - "${PORT:-9741}:9741"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://127.0.0.1:9741/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  delly_data:
