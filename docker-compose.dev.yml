###############################################################################
# delly — dev compose (hot reload): NestJS API watch + Vite dev server.
#
#   docker compose -f docker-compose.dev.yml up --build
#     PWA (HMR): http://localhost:9741
#     API:       http://localhost:7456
#
# Working trees are bind-mounted, so edits appear instantly. node_modules stays
# inside named volumes on purpose: esbuild and prisma ship platform-specific
# binaries that must not be shared with a Windows/macOS host.
###############################################################################

services:
  api-dev:
    build: ./api
    image: delly-api:dev
    container_name: delly-api-dev
    # Apply the schema (idempotent), then watch + restart on TS changes.
    command: ["sh", "-c", "npx prisma db push && npm run start:dev"]
    environment:
      PORT: 7456
      DATABASE_URL: "file:/data/dev.db"
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: dev-secret
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - delly_data_dev:/data
    ports:
      - "${API_PORT:-7456}:7456"
    restart: unless-stopped

  delly-pwa-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: delly-pwa:dev
    container_name: delly-pwa-dev
    depends_on:
      - api-dev
    environment:
      # The NestJS API the dev server proxies its routes to (see vite.config.js).
      # Inside the compose network the service is reachable by name.
      DG_API_TARGET: ${DG_API_TARGET:-http://api-dev:7456}
    ports:
      - "${DEV_PORT:-9741}:9741"
    volumes:
      # Source in, node_modules deliberately out (named volume below).
      - ./index.html:/app/index.html:cached
      - ./vite.config.js:/app/vite.config.js:cached
      - ./public:/app/public:cached
      - ./src:/app/src:cached
      - dev_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  dev_node_modules:
  api_node_modules:
  delly_data_dev:
