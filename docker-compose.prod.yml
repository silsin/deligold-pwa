###############################################################################
# delly — production compose for trade.ziva-vpn.online
#
#   cp .env.example .env        # fill in JWT_SECRET, SEED_ADMIN_*, MARKET_UID, MARKET_TOKEN
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Two containers:
#   pwa  — nginx serving the built Vue/Vite bundle, proxies API routes
#   api  — NestJS + Prisma + SQLite
#
# TLS is handled by the host nginx (certbot cert).
# Host nginx proxies trade.ziva-vpn.online → 127.0.0.1:9741
# pwa's nginx proxies /auth /trade /wallet etc. → api:7456 internally.
# The api container is NOT published to the host.
###############################################################################

services:

  pwa:
    build:
      context: .
      args:
        VITE_API_URL: ""
    image: delly-pwa:${IMAGE_TAG:-latest}
    container_name: delly-pwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:9741:9741"
    environment:
      PORT: 9741
      API_UPSTREAM: http://api:7456
      DNS_RESOLVER: 127.0.0.11
    depends_on:
      - api
    networks:
      - delly
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://127.0.0.1:9741/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build: ./api
    image: delly-api:${IMAGE_TAG:-latest}
    container_name: delly-api
    restart: unless-stopped
    expose:
      - "7456"
    environment:
      PORT: 7456
      DATABASE_URL: "file:/data/dev.db"
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      MARKET_UID: ${MARKET_UID:-}
      MARKET_TOKEN: ${MARKET_TOKEN:-}
      # Super-admin login, (re)set by the seed on every container start. Leave
      # SEED_ADMIN_PASSWORD blank to skip the seed and keep the current password.
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY must be set in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY must be set in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@delly.gold}
    volumes:
      - delly_data:/data
    networks:
      - delly
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://127.0.0.1:7456/market/board"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 25s

networks:
  delly:
    driver: bridge

volumes:
  delly_data:
